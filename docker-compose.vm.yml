version: '3.8'

services:
  daw-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3002"
    volumes:
      - ./src:/app/src
      - ./output:/app/output
      - ./dexed:/app/dexed
    environment:
      - NODE_ENV=development
    depends_on:
      - reaper-api
      - dexed-engine

  reaper-api:
    build:
      context: .
      dockerfile: Dockerfile.reaper
    ports:
      - "9010:8001"
    volumes:
      - ./src:/app/src
      - ./output:/app/output
      - ./reaper_linux_x86_64.tar.xz:/app/reaper_linux_x86_64.tar.xz
      - ./reaper.ini:/app/reaper.ini
    environment:
      - REAPER_PORT=8001
    command: python3 src/server/reaper_api_simple.py

  reaper-headless:
    build:
      context: .
      dockerfile: Dockerfile.reaper
    volumes:
      - ./src:/app/src
      - ./output:/app/output
      - ./reaper_linux_x86_64.tar.xz:/app/reaper_linux_x86_64.tar.xz
      - ./reaper.ini:/app/reaper.ini
    environment:
      - REAPER_PORT=8080
    command: /usr/local/bin/start-reaper.sh

  musicxml-parser-api:
    build:
      context: .
      dockerfile: Dockerfile.musicxml
    ports:
      - "8001:8001"
    volumes:
      - ./src:/app/src
      - ./output:/app/output
    environment:
      - PARSER_PORT=8001

  dexed-engine:
    build:
      context: .
      dockerfile: Dockerfile.dexed
    ports:
      - "8081:8081"
    volumes:
      - ./dexed:/app/dexed
      - ./output:/app/output
    environment:
      - DEXED_PORT=8081
    command: python3 /app/dexed_server.py 