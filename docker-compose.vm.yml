version: '3.8'

services:
  daw-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    volumes:
      - ./output:/app/output
    depends_on:
      - dexed-engine
      - musicxml-parser-api

  dexed-engine:
    build:
      context: .
      dockerfile: Dockerfile.dexed
    ports:
      - "8081:8081"
    volumes:
      - ./output:/app/output

  musicxml-parser-api:
    build:
      context: .
      dockerfile: Dockerfile.musicxml
    ports:
      - "8001:8001"
    volumes:
      - ./output:/app/output

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "3001:3001"
    environment:
      - IONOS_API_TOKEN=${IONOS_API_TOKEN}
    volumes:
      - ./output:/app/output
    depends_on:
      - daw-server 