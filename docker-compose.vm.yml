version: '3.8'

services:
  # DAW HTTP Server für VM-Produktion
  daw-server:
    build: .
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
    volumes:
      - ./output:/app/output
    command: ["node", "daw-http-server.js"]
    restart: unless-stopped

  # OpenWebUI für VM-Produktion
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - WEBUI_SECRET_KEY=your-secret-key-here
      - DEFAULT_MODELS=openai/gpt-4
      - ENABLE_SIGNUP=true
      - ENABLE_LOGIN_FORM=true
      - CREATE_ADMIN_USER=true
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - DISABLE_SIGNUP=false
    volumes:
      - openwebui_data:/app/backend/data
    restart: unless-stopped

  # Ollama für VM-Produktion
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Cloudflare Tunnel für VM-Produktion
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token eyJhIjoiMDRmZDJmZDlkNGYwYWY2ZmRmYWE0MDUwMjlmYmJmMWIiLCJ0IjoiM2QzMDQ3YzctNTE2NC00ODhmLTllMjEtOWMwMGJhMzA5ZWFmIiwicyI6Ik56SXlObVppWWpNdE56QmpNeTAwTW1Sa0xUazJaR1F0WTJFek9EQm1PV1ZsTkRFeSJ9
    restart: unless-stopped
    depends_on:
      - daw-server
      - openwebui

volumes:
  ollama_data:
  openwebui_data: 