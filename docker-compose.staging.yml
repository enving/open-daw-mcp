version: '3.8'

services:
  # DAW HTTP Server für Staging
  daw-server:
    build: .
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=staging
      - PORT=3002
    volumes:
      - ./output:/app/output
    command: ["node", "daw-http-server.js"]
    restart: unless-stopped

  # Nginx für Staging
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf
      - ./web:/usr/share/nginx/html
    depends_on:
      - daw-server
    restart: unless-stopped

  # Ollama für Staging
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data: 