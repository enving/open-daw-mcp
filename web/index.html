<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAW Interface</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 5px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .result {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .status {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .status.success {
            background: rgba(46, 204, 113, 0.3);
            border: 1px solid #2ecc71;
        }
        
        .status.error {
            background: rgba(231, 76, 60, 0.3);
            border: 1px solid #e74c3c;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 DAW Interface</h1>
        
        <div class="status" id="status"></div>
        
        <div class="grid">
            <div class="section">
                <h2>🎼 Melodie generieren</h2>
                <div class="form-group">
                    <label for="melodyPrompt">Beschreibung der Melodie:</label>
                    <textarea id="melodyPrompt" rows="3" placeholder="z.B. Eine fröhliche Melodie in C-Dur mit einem Jazz-Feeling"></textarea>
                </div>
                <div class="form-group">
                    <label for="melodyKey">Tonart:</label>
                    <select id="melodyKey">
                        <option value="C">C</option>
                        <option value="G">G</option>
                        <option value="D">D</option>
                        <option value="A">A</option>
                        <option value="E">E</option>
                        <option value="B">B</option>
                        <option value="F#">F#</option>
                        <option value="C#">C#</option>
                        <option value="F">F</option>
                        <option value="Bb">Bb</option>
                        <option value="Eb">Eb</option>
                        <option value="Ab">Ab</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="melodyTempo">Tempo (BPM):</label>
                    <input type="number" id="melodyTempo" value="120" min="60" max="200">
                </div>
                <button onclick="generateMelody()">Melodie generieren</button>
                <div class="loading" id="melodyLoading">
                    <div class="spinner"></div>
                    <p>Generiere Melodie...</p>
                </div>
                <div class="result" id="melodyResult"></div>
            </div>
            
            <div class="section">
                <h2>🎶 Song generieren</h2>
                <div class="form-group">
                    <label for="songPrompt">Beschreibung des Songs:</label>
                    <textarea id="songPrompt" rows="3" placeholder="z.B. Ein Rock-Song über Freiheit und Abenteuer"></textarea>
                </div>
                <div class="form-group">
                    <label for="songKey">Tonart:</label>
                    <select id="songKey">
                        <option value="C">C</option>
                        <option value="G">G</option>
                        <option value="D">D</option>
                        <option value="A">A</option>
                        <option value="E">E</option>
                        <option value="B">B</option>
                        <option value="F#">F#</option>
                        <option value="C#">C#</option>
                        <option value="F">F</option>
                        <option value="Bb">Bb</option>
                        <option value="Eb">Eb</option>
                        <option value="Ab">Ab</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="songTempo">Tempo (BPM):</label>
                    <input type="number" id="songTempo" value="120" min="60" max="200">
                </div>
                <button onclick="generateSong()">Song generieren</button>
                <div class="loading" id="songLoading">
                    <div class="spinner"></div>
                    <p>Generiere Song...</p>
                </div>
                <div class="result" id="songResult"></div>
            </div>
            
            <div class="section">
                <h2>🎧 Audio abspielen</h2>
                <div class="form-group">
                    <label for="audioFile">Audio-Datei auswählen:</label>
                    <input type="file" id="audioFile" accept="audio/*">
                </div>
                <button onclick="playAudio()">Audio abspielen</button>
                <audio id="audioPlayer" controls style="width: 100%; margin-top: 10px;"></audio>
            </div>
            
            <div class="section">
                <h2>📊 Server Status</h2>
                <button onclick="checkServerStatus()">Status prüfen</button>
                <div class="result" id="statusResult"></div>
            </div>
        </div>
    </div>

    <script>
        const DAW_SERVER_URL = 'http://87.106.81.49:3002';
        
        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            setTimeout(() => {
                status.textContent = '';
                status.className = 'status';
            }, 5000);
        }
        
        function showLoading(elementId) {
            document.getElementById(elementId).style.display = 'block';
        }
        
        function hideLoading(elementId) {
            document.getElementById(elementId).style.display = 'none';
        }
        
        async function makeRequest(endpoint, data = null) {
            try {
                const options = {
                    method: data ? 'POST' : 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                };
                
                if (data) {
                    options.body = JSON.stringify(data);
                }
                
                const response = await fetch(`${DAW_SERVER_URL}${endpoint}`, options);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('Request failed:', error);
                throw error;
            }
        }
        
        async function generateMelody() {
            const prompt = document.getElementById('melodyPrompt').value;
            const key = document.getElementById('melodyKey').value;
            const tempo = document.getElementById('melodyTempo').value;
            
            if (!prompt) {
                showStatus('Bitte geben Sie eine Beschreibung für die Melodie ein.', 'error');
                return;
            }
            
            showLoading('melodyLoading');
            
            try {
                const result = await makeRequest('/generate-melody', {
                    prompt: prompt,
                    key: key,
                    tempo: parseInt(tempo)
                });
                
                document.getElementById('melodyResult').textContent = JSON.stringify(result, null, 2);
                showStatus('Melodie erfolgreich generiert!');
            } catch (error) {
                showStatus(`Fehler beim Generieren der Melodie: ${error.message}`, 'error');
                document.getElementById('melodyResult').textContent = `Fehler: ${error.message}`;
            } finally {
                hideLoading('melodyLoading');
            }
        }
        
        async function generateSong() {
            const prompt = document.getElementById('songPrompt').value;
            const key = document.getElementById('songKey').value;
            const tempo = document.getElementById('songTempo').value;
            
            if (!prompt) {
                showStatus('Bitte geben Sie eine Beschreibung für den Song ein.', 'error');
                return;
            }
            
            showLoading('songLoading');
            
            try {
                const result = await makeRequest('/generate-song', {
                    prompt: prompt,
                    key: key,
                    tempo: parseInt(tempo)
                });
                
                document.getElementById('songResult').textContent = JSON.stringify(result, null, 2);
                showStatus('Song erfolgreich generiert!');
            } catch (error) {
                showStatus(`Fehler beim Generieren des Songs: ${error.message}`, 'error');
                document.getElementById('songResult').textContent = `Fehler: ${error.message}`;
            } finally {
                hideLoading('songLoading');
            }
        }
        
        function playAudio() {
            const fileInput = document.getElementById('audioFile');
            const audioPlayer = document.getElementById('audioPlayer');
            
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const url = URL.createObjectURL(file);
                audioPlayer.src = url;
                audioPlayer.play();
                showStatus('Audio wird abgespielt...');
            } else {
                showStatus('Bitte wählen Sie eine Audio-Datei aus.', 'error');
            }
        }
        
        async function checkServerStatus() {
            try {
                const result = await makeRequest('/health');
                document.getElementById('statusResult').textContent = JSON.stringify(result, null, 2);
                showStatus('Server ist erreichbar!');
            } catch (error) {
                document.getElementById('statusResult').textContent = `Fehler: ${error.message}`;
                showStatus('Server ist nicht erreichbar.', 'error');
            }
        }
        
        // Automatisch Server-Status beim Laden prüfen
        window.onload = function() {
            checkServerStatus();
        };
    </script>
</body>
</html>
