<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open DAW MCP - Reaper Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background-color: #f8f9ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background-color: #f0f2ff;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: 600;
        }

        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .track-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
        }

        .track-info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .note-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .note-item {
            background: white;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            font-size: 0.9rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .progress {
            width: 100%;
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .api-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #dc3545;
        }

        .status-indicator.connected {
            background-color: #28a745;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .card {
                padding: 20px;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Open DAW MCP</h1>
            <p>Reaper Integration für MusicXML-Verarbeitung</p>
        </div>

        <!-- API Status -->
        <div class="card">
            <h2>🔌 API Status</h2>
            <div class="api-status">
                <div class="status-indicator" id="apiStatus"></div>
                <span id="apiStatusText">Verbinde mit API...</span>
            </div>
            <div id="projectInfo" class="status info" style="display: none;"></div>
        </div>

        <!-- MusicXML Upload -->
        <div class="card">
            <h2>📁 MusicXML Upload</h2>
            <div class="upload-area" id="uploadArea">
                <p>📄 Ziehe eine MusicXML-Datei hierher oder klicke zum Auswählen</p>
                <input type="file" id="fileInput" class="file-input" accept=".musicxml,.xml">
            </div>
            <div class="controls">
                <button class="btn" id="parseBtn" disabled>MusicXML parsen</button>
                <button class="btn" id="importBtn" disabled>In Reaper importieren</button>
                <button class="btn btn-secondary" id="testBtn">Test mit Tame Impala</button>
            </div>
            <div id="uploadStatus"></div>
        </div>

        <!-- Track Information -->
        <div class="card" id="trackInfoCard" style="display: none;">
            <h2>🎼 Track Informationen</h2>
            <div id="trackInfo"></div>
        </div>

        <!-- Playback Controls -->
        <div class="card">
            <h2>🎮 Wiedergabe</h2>
            <div class="controls">
                <button class="btn btn-success" id="playBtn">▶️ Abspielen</button>
                <button class="btn btn-danger" id="stopBtn">⏹️ Stoppen</button>
                <button class="btn btn-secondary" id="exportBtn">💾 Audio exportieren</button>
            </div>
            <div id="playbackStatus"></div>
        </div>

        <!-- Export Section -->
        <div class="card">
            <h2>📤 Export</h2>
            <div class="controls">
                <input type="text" id="exportFilename" placeholder="Dateiname (z.B. song.wav)" value="tame_impala_export.wav" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; flex: 1;">
                <select id="exportFormat" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    <option value="wav">WAV</option>
                    <option value="mp3">MP3</option>
                    <option value="flac">FLAC</option>
                </select>
                <button class="btn" id="downloadBtn" style="display: none;">⬇️ Herunterladen</button>
            </div>
            <div id="exportStatus"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001';
        let currentFile = null;
        let trackData = null;

        // API Status Check
        async function checkApiStatus() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                const statusIndicator = document.getElementById('apiStatus');
                const statusText = document.getElementById('apiStatusText');
                const projectInfo = document.getElementById('projectInfo');
                
                if (data.status === 'healthy') {
                    statusIndicator.classList.add('connected');
                    statusText.textContent = 'API verbunden';
                    
                    if (data.project_info) {
                        projectInfo.style.display = 'block';
                        projectInfo.innerHTML = `
                            <strong>Reaper Status:</strong> ${data.project_info.reapy_available ? 'Verfügbar' : 'Nicht verfügbar'}<br>
                            <strong>Projekt:</strong> ${data.project_info.name}<br>
                            <strong>Tracks:</strong> ${data.project_info.tracks}
                        `;
                    }
                } else {
                    statusIndicator.classList.remove('connected');
                    statusText.textContent = 'API nicht erreichbar';
                }
            } catch (error) {
                console.error('API Status Check fehlgeschlagen:', error);
                document.getElementById('apiStatus').classList.remove('connected');
                document.getElementById('apiStatusText').textContent = 'API nicht erreichbar';
            }
        }

        // File Upload Handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            if (file.name.endsWith('.musicxml') || file.name.endsWith('.xml')) {
                currentFile = file;
                document.getElementById('parseBtn').disabled = false;
                document.getElementById('importBtn').disabled = false;
                
                showStatus('uploadStatus', `Datei ausgewählt: ${file.name}`, 'success');
            } else {
                showStatus('uploadStatus', 'Bitte wähle eine MusicXML-Datei aus', 'error');
            }
        }

        // Parse MusicXML
        document.getElementById('parseBtn').addEventListener('click', async () => {
            if (!currentFile) return;
            
            const formData = new FormData();
            formData.append('file', currentFile);
            
            try {
                showStatus('uploadStatus', 'Parse MusicXML...', 'info');
                
                const response = await fetch(`${API_BASE}/parse-musicxml`, {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    trackData = await response.json();
                    showTrackInfo(trackData);
                    showStatus('uploadStatus', 'MusicXML erfolgreich geparst!', 'success');
                } else {
                    const error = await response.json();
                    showStatus('uploadStatus', `Fehler: ${error.detail}`, 'error');
                }
            } catch (error) {
                showStatus('uploadStatus', `Fehler: ${error.message}`, 'error');
            }
        });

        // Import to Reaper
        document.getElementById('importBtn').addEventListener('click', async () => {
            if (!currentFile) return;
            
            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('project_name', 'Open DAW Import');
            
            try {
                showStatus('uploadStatus', 'Importiere in Reaper...', 'info');
                
                const response = await fetch(`${API_BASE}/import-to-reaper`, {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        showStatus('uploadStatus', 'Erfolgreich in Reaper importiert!', 'success');
                        checkApiStatus(); // Update project info
                    } else {
                        showStatus('uploadStatus', `Import fehlgeschlagen: ${result.message}`, 'error');
                    }
                } else {
                    const error = await response.json();
                    showStatus('uploadStatus', `Fehler: ${error.detail}`, 'error');
                }
            } catch (error) {
                showStatus('uploadStatus', `Fehler: ${error.message}`, 'error');
            }
        });

        // Test with Tame Impala
        document.getElementById('testBtn').addEventListener('click', async () => {
            try {
                showStatus('uploadStatus', 'Teste mit Tame Impala MusicXML...', 'info');
                
                const response = await fetch(`${API_BASE}/test-musicxml`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        trackData = result.track_info;
                        showTrackInfo(trackData);
                        showStatus('uploadStatus', 'Test erfolgreich! MusicXML importiert.', 'success');
                        checkApiStatus(); // Update project info
                    } else {
                        showStatus('uploadStatus', 'Test fehlgeschlagen', 'error');
                    }
                } else {
                    const error = await response.json();
                    showStatus('uploadStatus', `Fehler: ${error.detail}`, 'error');
                }
            } catch (error) {
                showStatus('uploadStatus', `Fehler: ${error.message}`, 'error');
            }
        });

        // Playback Controls
        document.getElementById('playBtn').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_BASE}/play`, { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    showStatus('playbackStatus', 'Projekt wird abgespielt', 'success');
                } else {
                    showStatus('playbackStatus', `Play fehlgeschlagen: ${result.message}`, 'error');
                }
            } catch (error) {
                showStatus('playbackStatus', `Fehler: ${error.message}`, 'error');
            }
        });

        document.getElementById('stopBtn').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_BASE}/stop`, { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    showStatus('playbackStatus', 'Wiedergabe gestoppt', 'success');
                } else {
                    showStatus('playbackStatus', `Stop fehlgeschlagen: ${result.message}`, 'error');
                }
            } catch (error) {
                showStatus('playbackStatus', `Fehler: ${error.message}`, 'error');
            }
        });

        // Export Audio
        document.getElementById('exportBtn').addEventListener('click', async () => {
            const filename = document.getElementById('exportFilename').value;
            const format = document.getElementById('exportFormat').value;
            
            if (!filename) {
                showStatus('exportStatus', 'Bitte gib einen Dateinamen ein', 'error');
                return;
            }
            
            try {
                showStatus('exportStatus', 'Exportiere Audio...', 'info');
                
                const response = await fetch(`${API_BASE}/export-audio?output_filename=${filename}&format=${format}`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        showStatus('exportStatus', 'Audio erfolgreich exportiert!', 'success');
                        document.getElementById('downloadBtn').style.display = 'inline-block';
                        document.getElementById('downloadBtn').onclick = () => {
                            window.open(`${API_BASE}/download-audio/${filename}`, '_blank');
                        };
                    } else {
                        showStatus('exportStatus', `Export fehlgeschlagen: ${result.message}`, 'error');
                    }
                } else {
                    const error = await response.json();
                    showStatus('exportStatus', `Fehler: ${error.detail}`, 'error');
                }
            } catch (error) {
                showStatus('exportStatus', `Fehler: ${error.message}`, 'error');
            }
        });

        // Helper Functions
        function showStatus(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function showTrackInfo(tracks) {
            const card = document.getElementById('trackInfoCard');
            const container = document.getElementById('trackInfo');
            
            container.innerHTML = '';
            
            tracks.forEach((track, index) => {
                const trackDiv = document.createElement('div');
                trackDiv.className = 'track-info';
                trackDiv.innerHTML = `
                    <h3>Track ${index + 1}: ${track.name}</h3>
                    <p><strong>Instrument:</strong> ${track.instrument}</p>
                    <p><strong>Kanal:</strong> ${track.channel}</p>
                    <p><strong>Noten:</strong> ${track.note_count}</p>
                    <div class="note-list">
                        ${track.notes.slice(0, 10).map(note => 
                            `<div class="note-item">${note.pitch} (${note.duration}ms)</div>`
                        ).join('')}
                        ${track.notes.length > 10 ? `<div class="note-item">... und ${track.notes.length - 10} weitere</div>` : ''}
                    </div>
                `;
                container.appendChild(trackDiv);
            });
            
            card.style.display = 'block';
        }

        // Initialize
        checkApiStatus();
        setInterval(checkApiStatus, 10000); // Check every 10 seconds
    </script>
</body>
</html>
