openapi: 3.0.0
info:
  title: Open DAW MCP Server
  description: MCP Bridge für Song-Erstellung und Audio-Generierung
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Development server
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
  /api/tools:
    get:
      summary: List available tools
      responses:
        '200':
          description: List of available tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        inputSchema:
                          type: object
  /api/openwebui/functions:
    post:
      summary: Execute a tool function
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the tool to execute
                arguments:
                  type: object
                  description: Arguments for the tool
              required:
                - name
      responses:
        '200':
          description: Tool execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
                    properties:
                      success:
                        type: boolean
                      song:
                        type: object
                        properties:
                          title:
                            type: string
                          style:
                            type: string
                          tempo:
                            type: integer
                          key:
                            type: string
                          structure:
                            type: array
                            items:
                              type: string
                          instruments:
                            type: array
                            items:
                              type: string
                          description:
                            type: string
                      files:
                        type: object
                        properties:
                          midi:
                            type: string
                          audio:
                            type: string
                      message:
                        type: string
        '500':
          description: Error executing tool
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas:
    SongRequest:
      type: object
      properties:
        description:
          type: string
          description: Natural language description of the desired song
        style:
          type: string
          description: Optional music style (Techno, House, Ambient, etc.)
        artist:
          type: string
          description: Optional inspiring artist
      required:
        - description 