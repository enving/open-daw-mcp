version: '3.8'

services:
  daw-server-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
    command: ["node", "src/server/index.js"]
    restart: unless-stopped 